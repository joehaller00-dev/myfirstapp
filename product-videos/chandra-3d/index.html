<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Chandra film</title>
<link rel="stylesheet" href="node_modules/@fontsource/eb-garamond/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/eb-garamond/400-italic.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/600.css">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
  canvas { position: absolute; inset: 0; display: block; }
  #vig { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.38) 100%); }
  #scrim { position: absolute; left: 0; right: 0; top: 0; height: 34%; opacity: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(6,5,4,.78) 0%, rgba(6,5,4,.5) 55%, rgba(6,5,4,0) 100%); }
  #fade { position: absolute; inset: 0; background: #060504; opacity: 0; pointer-events: none; }
  .label { position: absolute; color: #fff; opacity: 0; will-change: opacity, transform; }
  .label .eb { font: 600 calc(var(--u) * 15) / 1 Inter, sans-serif; letter-spacing: .26em; text-transform: uppercase; color: #c9a36a; }
  .label .hd { font: 400 calc(var(--u) * 62) / 1.02 "EB Garamond", serif; margin-top: calc(var(--u) * 16); color: #fff; }
  .label .hd em { font-style: italic; color: #efe3cc; }
  .label .sb { font: 400 calc(var(--u) * 17) / 1.5 Inter, sans-serif; margin-top: calc(var(--u) * 14); color: rgba(255,255,255,.74); letter-spacing: .02em; }
  .wide .label { right: 6.5%; top: 50%; width: 25%; margin-top: calc(var(--u) * -90); text-align: left; }
  .square .label { left: 0; right: 0; top: 6.5%; text-align: center; }
  .square .label .hd { font-size: calc(var(--u) * 58); margin-top: calc(var(--u) * 12); }
  .square .label .sb { margin-top: calc(var(--u) * 8); }
  .dots { display: flex; gap: calc(var(--u) * 10); margin-top: calc(var(--u) * 22); }
  .square .dots { justify-content: center; margin-top: calc(var(--u) * 14); }
  .dots i { width: calc(var(--u) * 34); height: calc(var(--u) * 3); border-radius: 2px; background: rgba(255,255,255,.22); }
  .dots i.on { background: #c9a36a; }
  .size { position: absolute; transform: translate(-50%, 0); color: #fff; text-align: center; opacity: 0; white-space: nowrap;
    font: 400 calc(var(--u) * 31) / 1 "EB Garamond", serif; }
  .size small { display: block; margin: 0 auto calc(var(--u) * 9); width: 1px; height: calc(var(--u) * 16); background: rgba(201,163,106,.8); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="vig"></div>
  <div id="scrim"></div>
  <div class="label" id="l-profile"><div class="eb">Slim profile</div><div class="hd">1.57 in <em>deep</em></div><div class="sb">An iron body that sits close to the wall.</div></div>
  <div class="label" id="l-art"><div class="eb">Full Moon Wall Lamp</div><div class="hd">Wall art first, <em>light second</em></div></div>
  <div class="label" id="l-tone"><div class="eb">3 Step Dimming</div><div class="hd"><span id="tone-k">3000K</span> <em id="tone-n">warm</em></div><div class="dots"><i id="d0"></i><i id="d1"></i><i id="d2"></i></div></div>
  <div class="label" id="l-size"><div class="eb">Six diameters</div><div class="hd">9.4 to <em>39.4 in</em></div></div>
  <div id="sizes"></div>
  <div id="fade"></div>
</div>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = innerWidth, H = innerHeight, SQUARE = W === H;
const stage = document.getElementById('stage');
stage.classList.add(SQUARE ? 'square' : 'wide');
stage.style.setProperty('--u', (H / 1080) + 'px');

// ---------- helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const pulse = (t, a, b, f = 0.5) => Math.min(ease(seg(t, a, a + f)), 1 - ease(seg(t, b - f, b)));

// ---------- renderer
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const loader = new THREE.TextureLoader();
const load = url => new Promise(res => loader.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; res(t); }));

// Light tones from the product spec: 3 Step Dimming (3000K / 4500K / 6000K)
const TONES = [new THREE.Color(1.0, 0.66, 0.34), new THREE.Color(1.0, 0.86, 0.68), new THREE.Color(0.86, 0.93, 1.0)];
const TONE_K = ['3000K', '4500K', '6000K'], TONE_N = ['warm', 'neutral', 'cool'];
const DEPTH = 1.57; // inches, every size

// ---------- lamp
const faceVert = `varying vec2 vUv; varying vec3 vN; void main(){ vUv = uv; vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const faceFrag = `
  uniform sampler2D map; uniform float uOn; uniform float uSweep; uniform vec3 uTone; uniform vec3 uAmb; uniform vec3 uKey; uniform vec3 uKeyDir;
  varying vec2 vUv; varying vec3 vN;
  void main(){
    vec2 p = (vUv - 0.5) * 2.0; float r = length(p);
    vec3 alb = texture2D(map, 0.5 + (vUv - 0.5) * 0.972).rgb;
    float bezel = smoothstep(0.972, 0.984, r);            // thin dark edge trim
    alb = mix(alb, vec3(0.03), bezel);
    vec3 unlit = alb * (uAmb + uKey * max(dot(normalize(vN), normalize(uKeyDir)), 0.0));
    // edge-lit face: brightest at the rim, light carried through the lunar print
    float rim = smoothstep(0.30, 1.0, r);
    float lum = dot(alb, vec3(0.3, 0.55, 0.15));
    vec3 through = pow(alb, vec3(0.85)) * (0.30 + 0.95 * rim * rim) + vec3(0.55) * pow(lum, 1.5) * rim * rim * rim;
    float ang = atan(p.x, -p.y) / 6.2831853 + 0.5;          // 0 at the bottom, clockwise
    float sw = clamp((uSweep * 1.25 - ang) / 0.25, 0.0, 1.0);
    float ring = smoothstep(0.90, 0.965, r) * (1.0 - bezel);
    vec3 lit = uTone * (through * uOn + ring * 1.5 * max(sw * (1.0 - uOn), uOn));
    gl_FragColor = vec4(unlit + lit * (1.0 - bezel), 1.0);
  }`;
const ironMat = new THREE.MeshStandardMaterial({ color: 0x0b0b0c, roughness: 0.42, metalness: 0.75 });
const haloTex = (() => {
  const n = 512, c = document.createElement('canvas'); c.width = c.height = n; const g = c.getContext('2d');
  const gr = g.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2);
  // dark under the lamp body, bright just outside the rim, long soft falloff
  [[0, 0], [0.36, 0], [0.4, 1], [0.47, 0.5], [0.6, 0.2], [0.8, 0.055], [1, 0]].forEach(([s, a]) => gr.addColorStop(s, `rgba(255,255,255,${a})`));
  g.fillStyle = gr; g.fillRect(0, 0, n, n); return new THREE.CanvasTexture(c);
})();
const shadowTex = (() => {
  const n = 256, c = document.createElement('canvas'); c.width = c.height = n; const g = c.getContext('2d');
  const gr = g.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2);
  [[0, 1], [0.78, 1], [0.9, 0.45], [1, 0]].forEach(([s, a]) => gr.addColorStop(s, `rgba(255,255,255,${a})`));
  g.fillStyle = gr; g.fillRect(0, 0, n, n); return new THREE.CanvasTexture(c);
})();
function makeLamp(faceTex, D) {
  const R = D / 2, grp = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(R, R, DEPTH * 0.62, 160, 1, false), ironMat);
  body.rotation.x = Math.PI / 2; body.position.z = DEPTH * 0.31; grp.add(body);
  const front = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.994, R * 0.994, DEPTH * 0.38, 160, 1, true), ironMat);
  front.rotation.x = Math.PI / 2; front.position.z = DEPTH * 0.81; grp.add(front);
  const u = { map: { value: faceTex }, uOn: { value: 0 }, uSweep: { value: 0 }, uTone: { value: TONES[0].clone() },
    uAmb: { value: new THREE.Color(0.02, 0.02, 0.025) }, uKey: { value: new THREE.Color(0, 0, 0) }, uKeyDir: { value: new THREE.Vector3(0, 0, 1) } };
  const face = new THREE.Mesh(new THREE.CircleGeometry(R * 0.994, 160), new THREE.ShaderMaterial({ uniforms: u, vertexShader: faceVert, fragmentShader: faceFrag }));
  face.position.z = DEPTH; grp.add(face);
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(R * 5, R * 5),
    new THREE.MeshBasicMaterial({ map: haloTex, color: 0x000000, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  halo.position.z = 0.03; grp.add(halo);
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(R * 1.16, 96), new THREE.MeshBasicMaterial({ map: shadowTex, color: 0x000000, transparent: true, opacity: 0.6, depthWrite: false }));
  shadow.position.set(R * 0.07, -R * 0.09, 0.02); grp.add(shadow);
  const light = new THREE.PointLight(0xffffff, 0, 0, 1.6); light.position.z = DEPTH + 2.5; grp.add(light);
  grp.userData = { u, halo, light, shadow, R, D };
  grp.set = (on, sweep, tone) => {
    u.uOn.value = on; u.uSweep.value = sweep; u.uTone.value.copy(tone);
    const k = Math.max(on, sweep * 0.25);
    halo.material.color.copy(tone).multiplyScalar(0.30 * k);
    light.color.copy(tone); light.intensity = k * R * R * 0.16;
  };
  return grp;
}

// ---------- room plate (real product photo, light spreads out from the lamp)
const roomFrag = `
  uniform sampler2D map; uniform vec3 uC; uniform float uSpread; uniform float uOn; varying vec2 vUv;
  void main(){
    vec3 col = texture2D(map, vUv).rgb;
    float d = distance(vUv, uC.xy);
    float reach = uC.z * 0.9 + uSpread * 1.6;
    float lit = 1.0 - smoothstep(reach - 0.36, reach, d);
    lit = mix(lit * uSpread, 1.0, uOn);
    float g = dot(col, vec3(0.3, 0.55, 0.15));
    vec3 night = mix(vec3(g), col, 0.35) * vec3(0.10, 0.115, 0.15);   // room before the lamp is on
    gl_FragColor = vec4(mix(night, col, lit), 1.0);
  }`;
const ROOMS = [
  { f: 'room-bed', c: [0.5053, 0.3595, 0.2009], wide: [[0.5, 0.45, 1.0], [0.505, 0.40, 1.1]], sq: [[0.5, 0.5, 1.0], [0.5, 0.46, 1.14]] },
  { f: 'room-entry', c: [0.5205, 0.3649, 0.1679], wide: [[0.5, 0.48, 1.0], [0.51, 0.455, 1.07]], sq: [[0.52, 0.46, 1.16], [0.5, 0.5, 1.0]] },
  { f: 'room-window', c: [0.2724, 0.3775, 0.1516], wide: [[0.5, 0.47, 1.0], [0.46, 0.43, 1.07]], sq: [[0.5, 0.5, 1.0], [0.45, 0.47, 1.1]] },
];

// ---------- build
const [faceTex, ...roomTex] = await Promise.all([load('assets/face.jpg'), ...ROOMS.map(r => load(`assets/${r.f}.jpg`))]);
await document.fonts.ready;

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x050505);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.5, 2000);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(900, 500), new THREE.MeshStandardMaterial({ color: 0x8d8379, roughness: 0.94, metalness: 0 }));
scene.add(wall);
const hemi = new THREE.HemisphereLight(0x8fa0c0, 0x231c16, 0.0); scene.add(hemi);
const key = new THREE.DirectionalLight(0xbfd0f0, 0.0); key.position.set(-70, 50, 90); scene.add(key);

const hero = makeLamp(faceTex, 23.6); scene.add(hero);
const SIZES = [9.4, 11.8, 19.7, 23.6, 31.5, 39.4], GAP = 7;
const rowW = SIZES.reduce((a, b) => a + b, 0) + GAP * (SIZES.length - 1);
const row = new THREE.Group(); scene.add(row);
const sizesEl = document.getElementById('sizes');
let x = -rowW / 2;
const rowLamps = SIZES.map(D => {
  const l = makeLamp(faceTex, D); l.position.set(x + D / 2, 0, 0); x += D + GAP; row.add(l);
  const el = document.createElement('div'); el.className = 'size'; el.innerHTML = `<small></small>${D} in`; sizesEl.appendChild(el); l.userData.el = el;
  return l;
});

const roomScene = new THREE.Scene(); roomScene.background = new THREE.Color(0x000000);
const roomCam = new THREE.OrthographicCamera(-0.5, 0.5, 0.5, -0.5, 0, 2);
roomCam.position.z = 1;
const roomU = { map: { value: roomTex[0] }, uC: { value: new THREE.Vector3() }, uSpread: { value: 0 }, uOn: { value: 0 } };
const roomPlate = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({ uniforms: roomU, vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`, fragmentShader: roomFrag }));
roomScene.add(roomPlate);

const composer = new EffectComposer(renderer);
const pass3d = new RenderPass(scene, cam), passRoom = new RenderPass(roomScene, roomCam);
composer.addPass(pass3d); composer.addPass(passRoom);
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.3, 0.6, 0.9); composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- timeline (seconds)
const T1 = 7.2, T2 = 14.6, T3 = 21.6, ROOM = 3.0, TOTAL = T3 + ROOM * ROOMS.length;
window.TOTAL = TOTAL;
const $ = id => document.getElementById(id);
const show = (el, o, dy = 0) => { el.style.opacity = o.toFixed(3); el.style.transform = `translateY(${((1 - o) * dy).toFixed(2)}px)`; };
const fadeEl = $('fade');
const tmp = new THREE.Vector3(), mix = new THREE.Color();
function tone3(k) { // k in [0,3): blends through warm -> neutral -> cool -> warm
  const i = Math.floor(k) % 3, f = ease(k - Math.floor(k)); return mix.copy(TONES[i]).lerp(TONES[(i + 1) % 3], f);
}
function room(key, env) { hemi.intensity = env * 0.5; key3(key); }
function key3(v) { key.intensity = v; }
function faceLight(l) { // match the face shader's ambient/key to the scene lights
  const u = l.userData.u;
  u.uAmb.value.setRGB(hemi.intensity * 0.20, hemi.intensity * 0.22, hemi.intensity * 0.27);
  l.userData.shadow.material.opacity = 0.25 + 0.4 * clamp(key.intensity / 3.6);
  u.uKey.value.copy(key.color).multiplyScalar(key.intensity * 0.3);
  u.uKeyDir.value.copy(key.position).normalize().transformDirection(cam.matrixWorldInverse);
}

window.renderAt = function (t) {
  let fade = 0;
  ['l-profile', 'l-art', 'l-tone', 'l-size'].forEach(id => show($(id), 0));
  rowLamps.forEach(l => { l.userData.el.style.opacity = 0; });
  const is3d = t < T3;
  pass3d.enabled = is3d; passRoom.enabled = !is3d;

  if (t < T2) {                       // ---- S1 profile -> ignition, S2 three tones (one continuous move)
    hero.visible = true; row.visible = false;
    const orbit = ease(seg(t, 0.6, 5.4));
    const th = lerp(1.09, SQUARE ? 0.0 : -0.12, orbit) + (t > T1 ? Math.sin((t - T1) * 0.55) * 0.07 : 0);
    const dist = lerp(21, SQUARE ? 98 : 88, ease(seg(t, 0.9, 5.6))) - seg(t, T1, T2) * 5;
    const R = hero.userData.R;
    const tx = lerp(R * 0.93, SQUARE ? 0 : 7.5, orbit), ty = lerp(1.5, SQUARE ? 6.5 : 0, orbit);
    cam.position.set(tx + Math.sin(th) * dist, ty + lerp(2.5, 0, orbit), Math.cos(th) * dist + DEPTH * 0.5);
    cam.lookAt(tx, ty, DEPTH * 0.5);
    const day = 1 - ease(seg(t, 3.4, 5.0));          // room light falls as the lamp comes on
    hemi.intensity = 0.12 + 1.5 * day; key.intensity = 0.25 + 3.6 * day;
    const sweep = easeOut(seg(t, 3.9, 5.2)), on = ease(seg(t, 4.7, 6.1));
    let tone = TONES[0];
    if (t > T1) { const k = (t - T1) / ((T2 - T1 - 0.4) / 3); tone = tone3(Math.min(k, 2.999) * 1.0);
      // hold each tone, then glide: remap so 70% hold / 30% glide
      const st = Math.min(Math.floor(k), 2), fr = clamp(k - st); const g = ease(seg(fr, 0.72, 1.0));
      tone = mix.copy(TONES[st]).lerp(TONES[(st + 1) % 3], st < 2 ? g : 0);
      const cur = g > 0.5 && st < 2 ? st + 1 : st;
      $('tone-k').textContent = TONE_K[cur]; $('tone-n').textContent = TONE_N[cur];
      ['d0', 'd1', 'd2'].forEach((d, i) => $(d).classList.toggle('on', i === cur));
      show($('l-tone'), pulse(t, T1 + 0.1, T2 - 0.5, 0.5), 12);
    }
    const off = 1 - ease(seg(t, T2 - 0.55, T2 - 0.1));
    hero.set(on * off, sweep * off, tone);
    show($('l-profile'), pulse(t, 0.7, 3.5, 0.6), 12);
    show($('l-art'), pulse(t, 5.2, T1 - 0.1, 0.6), 12);
    fade = Math.max(1 - ease(seg(t, 0, 0.7)), ease(seg(t, T2 - 0.4, T2)));
  } else if (t < T3) {                // ---- S3 six sizes, to scale
    hero.visible = false; row.visible = true;
    const lt = t - T2, span = T3 - T2;
    hemi.intensity = 0.14; key.intensity = 0.3;
    const fit = rowW / (2 * Math.tan(THREE.MathUtils.degToRad(15)) * cam.aspect);   // distance where the row fills the width
    const dist = fit * (SQUARE ? 1.16 : 1.24) * lerp(1.1, 1.0, ease(lt / span));
    const pan = lerp(-6, 6, ease(lt / span)) * (SQUARE ? 0.5 : 1);
    cam.position.set(pan * 0.8, 3, dist); cam.lookAt(pan * 0.25, SQUARE ? 5 : 2.5, 0);
    rowLamps.forEach((l, i) => {
      const s = 0.5 + i * 0.52, sweep = easeOut(seg(lt, s, s + 0.7)), on = ease(seg(lt, s + 0.35, s + 1.2));
      const off = 1 - ease(seg(lt, span - 0.6, span - 0.15));
      l.set(on * off, sweep * off, TONES[0]);
      tmp.set(l.position.x, -l.userData.R - 3.2, DEPTH).project(cam);
      const el = l.userData.el; el.style.left = ((tmp.x * 0.5 + 0.5) * W) + 'px'; el.style.top = ((-tmp.y * 0.5 + 0.5) * H) + 'px';
      el.style.opacity = (ease(seg(lt, s + 0.5, s + 1.1)) * (1 - ease(seg(lt, span - 0.8, span - 0.4)))).toFixed(3);
    });
    show($('l-size'), pulse(t, T2 + 0.5, T3 - 0.5, 0.5), 12);
    $('l-size').style.top = SQUARE ? '' : '13%'; $('l-size').style.marginTop = SQUARE ? '' : '0';
    fade = Math.max(1 - ease(seg(lt, 0, 0.45)), ease(seg(lt, span - 0.4, span)));
  } else {                            // ---- S4 at home: real product photos, the lamp comes on in each room
    const i = Math.min(ROOMS.length - 1, Math.floor((t - T3) / ROOM)), lt = t - T3 - i * ROOM, r = ROOMS[i];
    roomU.map.value = roomTex[i]; roomU.uC.value.set(r.c[0], 1 - r.c[1], r.c[2]);
    roomU.uSpread.value = easeOut(seg(lt, 0.35, 1.7)); roomU.uOn.value = ease(seg(lt, 1.0, 2.0));
    const [a, b] = SQUARE ? r.sq : r.wide, k = ease(lt / ROOM) * 0.5 + (lt / ROOM) * 0.5;
    const z = lerp(a[2], b[2], k), w = 1 / z, h = w * (H / W);
    const cx = clamp(lerp(a[0], b[0], k), w / 2, 1 - w / 2), cy = clamp(lerp(a[1], b[1], k), h / 2, 1 - h / 2);
    roomCam.left = cx - 0.5 - w / 2; roomCam.right = cx - 0.5 + w / 2; roomCam.top = (0.5 - cy) + h / 2; roomCam.bottom = (0.5 - cy) - h / 2;
    roomCam.updateProjectionMatrix();
    fade = Math.max(1 - ease(seg(lt, 0, 0.35)), ease(seg(lt, ROOM - 0.35, ROOM)));
  }
  $('l-size').style.top = (t >= T2 && t < T3 && !SQUARE) ? '13%' : '';
  cam.updateMatrixWorld(); cam.matrixWorldInverse.copy(cam.matrixWorld).invert();
  faceLight(hero); rowLamps.forEach(faceLight);
  bloom.strength = is3d ? 0.3 : 0.2;
  $('scrim').style.opacity = SQUARE ? Math.max(...['l-profile', 'l-art', 'l-tone'].map(id => +$(id).style.opacity)).toFixed(3) : 0;
  fadeEl.style.opacity = fade.toFixed(3);
  composer.render();
};
window.renderAt(0);
window.READY = true;
</script>
</body>
</html>
